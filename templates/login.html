{% extends "base.html" %}
{% block content %}
<div style="min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:16px;">
  <div style="width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:32px;font-weight:900;color:var(--accent);letter-spacing:2px;margin-bottom:4px;">TRIXIFILMS</div>
      <p style="color:var(--muted);font-size:13px;margin:0;">Connectez-vous à votre compte</p>
    </div>

    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div style="margin-bottom:18px;">
        <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Prénom</label>
        <input name="prenom" type="text" autocomplete="username" required
               placeholder="Votre prénom"
               style="width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:var(--text);font-size:14px;outline:none;box-sizing:border-box;transition:border-color .15s;"
               onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='rgba(255,255,255,0.06)'">
      </div>

      <div style="margin-bottom:24px;">
        <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Mot de passe</label>
        <input name="password" type="password" autocomplete="current-password" required
               placeholder="Votre mot de passe"
               style="width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:var(--text);font-size:14px;outline:none;box-sizing:border-box;transition:border-color .15s;"
               onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='rgba(255,255,255,0.06)'">
      </div>

      <button type="submit"
              style="width:100%;padding:12px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;margin-bottom:16px;"
              onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'">
        Se connecter
      </button>

      <div style="text-align:center;">
        <a href="{{ url_for('auth.register') }}" style="color:var(--muted);font-size:13px;text-decoration:none;transition:color .15s;"
           onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">
          Pas encore de compte ? <strong style="color:var(--accent);">S'inscrire</strong>
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
