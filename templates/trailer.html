<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TRIXIFILMS</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
var player = null;
var pendingAutoplay = {{ autoplay }};
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.body.appendChild(tag);

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('player', {
    videoId: '{{ video_id }}',
    host: 'https://www.youtube-nocookie.com',
    playerVars: {
      autoplay: {{ autoplay }},
      rel: 0,
      playsinline: 1,
      modestbranding: 1,
      hl: '{{ hl }}',
      start: {{ start }},
      cc_lang_pref: '{{ cclang }}',
      cc_load_policy: {{ cc }}
    },
    events: {
      onReady: function () {
        if (pendingAutoplay) { player.playVideo(); }
        window.flutter_inappwebview &&
          window.flutter_inappwebview.callHandler('trxPlayerReady');
      }
    }
  });
};

function trxCcSet(mode, lang) {
  if (!player || !player.loadModule) return;
  try {
    if (mode === 'off') {
      player.unloadModule('captions');
      return;
    }
    player.loadModule('captions');
    if (lang && lang !== 'auto') {
      player.setOption('captions', 'track', { languageCode: lang });
    } else {
      player.setOption('captions', 'track', {});
    }
  } catch (e) {}
}

function trxGetCcTracks() {
  if (!player || !player.getOption) return '[]';
  try {
    var list = player.getOption('captions', 'tracklist') || [];
    return JSON.stringify(list.map(function (t) {
      return { code: (t.languageCode || ''), name: (t.displayName || t.languageCode || '') };
    }));
  } catch (e) { return '[]'; }
}

function trxGetPosition() {
  try { return Math.floor(player && player.getCurrentTime ? player.getCurrentTime() : 0); }
  catch (e) { return 0; }
}
</script>
</body>
</html>
