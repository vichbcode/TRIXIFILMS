{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container mx-auto p-4 sm:p-6 bg-gray-900 rounded-lg shadow-lg max-w-4xl">
    <h1 class="text-xl sm:text-3xl font-bold mb-6 text-white">Modifier : {{ movie.nom }}</h1>

    <form id="edit-movie-form" action="" method="POST" enctype="multipart/form-data" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="flex flex-col">
            <label for="title" class="mb-2 font-semibold text-white text-sm sm:text-base">Nom du film</label>
            <input type="text" id="title" name="title" value="{{ movie.nom }}" required
                   class="p-3 rounded-lg bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-red-500 text-base">
        </div>

        <div class="flex flex-col">
            <label for="description" class="mb-2 font-semibold text-white text-sm sm:text-base">Résumé</label>
            <textarea id="description" name="description" required
                      class="p-3 rounded-lg bg-gray-800 text-white h-32 sm:h-40 resize-none focus:outline-none focus:ring-2 focus:ring-red-500 text-base">{{ movie.resume }}</textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="flex flex-col">
                <label for="directors" class="mb-2 font-semibold text-white text-sm sm:text-base">Réalisateurs</label>
                <input type="text" id="directors" name="directors" value="{{ movie.realisateurs }}"
                       class="p-3 rounded-lg bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            <div class="flex flex-col">
                <label for="writers" class="mb-2 font-semibold text-white text-sm sm:text-base">Scénaristes</label>
                <input type="text" id="writers" name="writers" value="{{ movie.scenaristes }}"
                       class="p-3 rounded-lg bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
        </div>

        <div class="flex flex-col">
            <label for="productions" class="mb-2 font-semibold text-white text-sm sm:text-base">Productions</label>
            <input type="text" id="productions" name="productions" value="{{ movie.productions }}"
                   class="p-3 rounded-lg bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <div class="flex flex-col">
            <label for="image" class="mb-2 font-semibold text-white text-sm sm:text-base">Image du film</label>
            <input type="file" id="image" name="image" class="text-white text-sm w-full">
            {% if film_image %}
            <img src="{{ film_image }}" class="poster-preview mt-2 rounded-lg shadow-md max-w-full h-auto" style="max-height:200px;" alt="Affiche actuelle">
            {% endif %}
        </div>

        <hr class="border-gray-700">

        <h3 class="text-xl sm:text-2xl font-semibold text-white mb-3">Distribution / Équipe</h3>
        <div id="actors-list" class="space-y-4">
            {% for acteur in acteurs %}
            <div class="actor-item flex flex-col sm:flex-row items-start sm:items-center gap-3 p-3 bg-gray-850 rounded-lg border border-gray-700">
                <input type="text" name="actor_name[]" value="{{ acteur.nom }}" placeholder="Nom complet" required
                       class="w-full sm:flex-1 p-3 rounded-lg bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
                <select name="actor_role[]" class="p-3 rounded bg-gray-800 text-white w-full sm:w-auto">
                  <option {% if acteur.role == 'Acteur' %}selected{% endif %}>Acteur</option>
                  <option {% if acteur.role == 'Réalisateur' %}selected{% endif %}>Réalisateur</option>
                  <option {% if acteur.role == 'Scénariste' %}selected{% endif %}>Scénariste</option>
                </select>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                  <label class="text-xs text-gray-400">Photo:</label>
                  <input type="file" name="actor_image[]" class="text-white text-xs flex-1">
                  {% if acteur.image %}
                  <img src="{{ acteur.image }}" class="w-10 h-10 object-cover rounded-full shadow-md" alt="Photo acteur">
                  {% endif %}
                </div>
                <button type="button" class="remove-actor bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded transition text-sm w-full sm:w-auto touch-target">Supprimer</button>
            </div>
            {% endfor %}
        </div>
        <button type="button" id="add-actor"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded transition text-sm touch-target">+ Ajouter une personne</button>

        <hr class="border-gray-700">

        <button type="submit"
                class="w-full bg-red-500 hover:bg-red-600 text-white font-bold text-base sm:text-lg py-3 rounded-lg transition touch-target">Enregistrer les modifications</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const container = document.getElementById('actors-list');
  const addBtn = document.getElementById('add-actor');

  function makeActorRow(name = '', role = 'Acteur') {
    const row = document.createElement('div');
    row.className = 'actor-item flex flex-col sm:flex-row items-start sm:items-center gap-3 p-3 bg-gray-850 rounded-lg border border-gray-700';

    const inName = document.createElement('input');
    inName.type = 'text';
    inName.name = 'actor_name[]';
    inName.placeholder = 'Nom complet';
    inName.className = 'w-full sm:flex-1 p-3 rounded-lg bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-red-500';
    inName.required = true;
    inName.value = name;

    const sel = document.createElement('select');
    sel.name = 'actor_role[]';
    sel.className = 'p-3 rounded bg-gray-800 text-white w-full sm:w-auto';
    ['Acteur','Réalisateur','Scénariste'].forEach(r => {
      const o = document.createElement('option');
      o.value = r;
      o.textContent = r;
      if (r === role) o.selected = true;
      sel.appendChild(o);
    });

    const fileWrap = document.createElement('div');
    fileWrap.className = 'flex items-center gap-2 w-full sm:w-auto';
    const label = document.createElement('span');
    label.className = 'text-xs text-gray-400';
    label.textContent = 'Photo:';
    const file = document.createElement('input');
    file.type = 'file';
    file.name = 'actor_image[]';
    file.className = 'text-white text-xs flex-1';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'remove-actor bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded transition text-sm w-full sm:w-auto touch-target';
    btn.textContent = 'Supprimer';
    btn.addEventListener('click', () => row.remove());

    fileWrap.appendChild(label);
    fileWrap.appendChild(file);
    row.appendChild(inName);
    row.appendChild(sel);
    row.appendChild(fileWrap);
    row.appendChild(btn);
    return row;
  }

  addBtn.addEventListener('click', function() {
    container.appendChild(makeActorRow());
  });

  container.addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-actor')) {
      e.target.closest('.actor-item')?.remove();
    }
  });
});
</script>

{% endblock %}
